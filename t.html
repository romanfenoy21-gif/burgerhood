<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ticket - Burger Hood</title>
<style>
  :root { --w: 80mm; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #2a2a2a; }
  body { font-family: "Courier New", Courier, monospace; color: #000; }

  .bar {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center;
    padding: 12px; background: #131313; position: sticky; top: 0;
    font-family: Arial, Helvetica, sans-serif;
  }
  .bar button {
    font: inherit; font-size: 15px; font-weight: 700; padding: 12px 18px;
    border: 1px solid #524534; background: #1c1b1b; color: #e5e2e1; cursor: pointer;
  }
  .bar button.main { background: #f5a623; border-color: #f5a623; color: #0d0d0d; font-size: 17px; padding: 12px 28px; }
  .bar button.on { border-color: #f5a623; color: #f5a623; }
  .bar .sep { width: 12px; }

  #ticket {
    width: var(--w); max-width: 100%; margin: 16px auto; padding: 4mm 3mm 8mm;
    background: #fff; font-size: 13px; line-height: 1.3; word-wrap: break-word; overflow-wrap: anywhere;
  }
  body.w58 { --w: 58mm; }
  body.w58 #ticket { font-size: 11.5px; padding: 3mm 2mm 8mm; }

  .c { text-align: center; }
  .b { font-weight: 700; }
  .brand { font-size: 1.7em; font-weight: 700; letter-spacing: 1px; }
  .num { font-size: 2.1em; font-weight: 700; margin: 2px 0; }
  .big { font-size: 1.35em; font-weight: 700; }
  hr { border: 0; border-top: 1px dashed #000; margin: 6px 0; }
  .row { display: flex; justify-content: space-between; gap: 8px; }
  .row span:last-child { white-space: nowrap; }
  .item { margin: 6px 0; }
  .item .name { font-weight: 700; font-size: 1.1em; text-transform: uppercase; }
  .sub { padding-left: 10px; }
  .nota { margin: 2px 0 2px 10px; padding: 2px 5px; border: 1.5px solid #000; font-weight: 700; display: inline-block; }
  .total { font-size: 1.6em; font-weight: 700; }
  .box { border: 2px solid #000; padding: 4px 6px; margin: 4px 0; }
  .err { font-family: Arial, sans-serif; padding: 10px; text-align: center; }

  @page { margin: 0; }
  @media print {
    html, body { background: #fff; }
    .bar { display: none; }
    #ticket { margin: 0; }
  }
</style>
<script src="codes.js"></script>
</head>
<body>

<div class="bar">
  <button class="main" onclick="window.print()">Imprimir</button>
  <span class="sep"></span>
  <button id="w80" onclick="setW(80)">80 mm</button>
  <button id="w58" onclick="setW(58)">58 mm</button>
</div>

<div id="ticket"></div>

<script>
// ── Utilidades ───────────────────────────────────────────────────────────────
function fmt(n) { return '$' + Number(n || 0).toLocaleString('es-AR'); }

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text; // siempre como texto, nunca HTML
  return e;
}

function row(left, right, cls) {
  const r = el('div', 'row' + (cls ? ' ' + cls : ''));
  r.appendChild(el('span', '', left));
  r.appendChild(el('span', '', right));
  return r;
}

function getStore(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function setStore(key, val) { try { localStorage.setItem(key, val); return true; } catch (e) { return false; } }

// ── Ancho del papel (se recuerda en este dispositivo) ────────────────────────
function setW(w) {
  document.body.classList.toggle('w58', w === 58);
  document.getElementById('w80').classList.toggle('on', w !== 58);
  document.getElementById('w58').classList.toggle('on', w === 58);
  setStore('bh_ticket_w', String(w));
}

// ── Leer el pedido del link (formato corto, ver buildTicketUrl en index.html) ─
const A = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
const T = window.BH_CODES || [];

function splitEsc(s, sep) {            // corta por sep, salvo que esté escapado con \
  const out = []; let cur = '';
  for (let i = 0; i < s.length; i++) {
    if (s[i] === '\\' && i + 1 < s.length) { cur += s[i] + s[i + 1]; i++; }
    else if (s[i] === sep) { out.push(cur); cur = ''; }
    else cur += s[i];
  }
  out.push(cur);
  return out;
}
function unesc(s) { return String(s || '').replace(/\\([\s\S])/g, '$1'); }
function num(s) { return s[0] === '=' ? parseInt(s.slice(1), 36) : parseInt(s, 36) * 100; }

// Lee un nombre desde la posición i: una letra = código de la tabla, "..." = texto tal cual
function readTok(s, i) {
  if (s[i] === '"') {
    let j = i + 1, raw = '';
    while (j < s.length && s[j] !== '"') {
      if (s[j] === '\\' && j + 1 < s.length) { raw += s[j] + s[j + 1]; j += 2; }
      else { raw += s[j]; j++; }
    }
    return [unesc(raw), j + 1];
  }
  const k = A.indexOf(s[i]);
  return [k >= 0 && T[k] !== undefined ? T[k] : '¿?', i + 1];
}

function readOrder() {
  let h = window.location.hash.replace(/^#/, '');
  if (!h) return null;
  h = h.replace(/-/g, '+').replace(/_/g, '/');
  while (h.length % 4) h += '=';
  const bin = atob(h);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const text = new TextDecoder().decode(bytes);

  const parts = splitEsc(text, '~');
  const head = splitEsc(parts[0], '|');
  if (head[0][0] !== '2' || head.length < 5) return null;
  const flag = 'abcd'.indexOf(head[0][1]);
  if (flag < 0) return null;

  const d = {
    t: Date.UTC(2026, 0, 1) + parseInt(head[1], 36) * 60000,
    pago: flag < 2 ? 'transferencia' : 'efectivo',
    delivery: flag % 2 === 1,
    fee: head[2] ? num(head[2]) : 0,
    nombre: unesc(head[3]),
    addr: unesc(head[4]),
    tel: unesc(head[5] || ''),
    items: []
  };

  parts.slice(1).forEach(function (p) {
    const f = splitEsc(p, '|');
    const it = { name: readTok(f[0], 0)[0], price: num(f[1] || '0'), detail: [], extras: [], nota: unesc(f[4] || '') };
    let s = f[2] || '', i = 0;
    while (i < s.length) { const r = readTok(s, i); it.detail.push(r[0]); i = r[1]; }
    s = f[3] || ''; i = 0;
    while (i < s.length) {
      const r = readTok(s, i); i = r[1];
      let j = s.indexOf(',', i); if (j < 0) j = s.length;
      it.extras.push({ name: r[0], price: num(s.slice(i, j) || '0') });
      i = j + 1;
    }
    d.items.push(it);
  });
  if (!d.items.length || isNaN(d.t)) return null;
  return d;
}

// ── Número de pedido del día (lo lleva este dispositivo) ─────────────────────
// El mismo link siempre da el mismo número; cada pedido nuevo suma uno.
// La "jornada" cambia a las 6 AM, así los pedidos de después de medianoche siguen la cuenta.
function orderNumber(key) {
  const now = new Date(Date.now() - 6 * 3600 * 1000);
  const day = now.getFullYear() + '-' + (now.getMonth() + 1) + '-' + now.getDate();
  let st = null;
  try { st = JSON.parse(getStore('bh_ticket_nums') || 'null'); } catch (e) {}
  if (!st || st.day !== day || !st.map) st = { day: day, last: 0, map: {} };
  if (!st.map[key]) { st.last += 1; st.map[key] = st.last; }
  return setStore('bh_ticket_nums', JSON.stringify(st)) ? st.map[key] : null;
}

// ── Dibujar el ticket ────────────────────────────────────────────────────────
function render() {
  const t = document.getElementById('ticket');
  let d = null;
  try { d = readOrder(); } catch (e) { d = null; }

  if (!d) {
    t.appendChild(el('div', 'err b', 'No hay ningún pedido para mostrar.'));
    t.appendChild(el('div', 'err', 'Abrí esta página desde el link "Ticket" que llega en el mensaje de WhatsApp del pedido.'));
    document.querySelector('.bar').style.display = 'none';
    return;
  }

  const when = new Date(d.t);
  const fecha = when.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  const hora = when.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
  const n = orderNumber(window.location.hash.slice(1));

  t.appendChild(el('div', 'c brand', 'BURGER HOOD'));
  if (n) t.appendChild(el('div', 'c num', '#' + n));
  t.appendChild(el('div', 'c', fecha + '  ' + hora));
  t.appendChild(el('hr'));

  t.appendChild(el('div', 'big', d.nombre || 'Sin nombre'));
  if (d.tel) t.appendChild(el('div', 'b', 'Tel: ' + d.tel));

  const box = el('div', 'box');
  if (d.delivery) {
    box.appendChild(el('div', 'big', 'DELIVERY'));
    box.appendChild(el('div', 'b', d.addr));
  } else {
    box.appendChild(el('div', 'big', 'RETIRA EN LOCAL'));
  }
  t.appendChild(box);
  t.appendChild(el('hr'));

  let subtotal = 0;
  d.items.forEach(function (it) {
    let itemTotal = it.price;
    it.extras.forEach(function (x) { itemTotal += x.price; });
    subtotal += itemTotal;

    const item = el('div', 'item');
    const head = row(it.name, fmt(itemTotal));
    head.firstChild.className = 'name';
    item.appendChild(head);
    it.detail.forEach(function (p) { item.appendChild(el('div', 'sub', p)); });
    it.extras.forEach(function (x) { item.appendChild(el('div', 'sub b', '+ ' + x.name + ' (' + fmt(x.price) + ')')); });
    if (it.nota) item.appendChild(el('div', 'nota', 'NOTA: ' + it.nota));
    t.appendChild(item);
  });

  t.appendChild(el('hr'));
  if (d.fee > 0) {
    t.appendChild(row('Subtotal', fmt(subtotal)));
    t.appendChild(row('Delivery', fmt(d.fee)));
  }
  t.appendChild(row('TOTAL', fmt(subtotal + d.fee), 'total'));
  t.appendChild(el('hr'));
  t.appendChild(el('div', 'c big', 'PAGA: ' + d.pago.toUpperCase()));
  t.appendChild(el('div', 'c', d.items.length + (d.items.length === 1 ? ' producto' : ' productos')));

  document.title = 'Ticket ' + (n ? '#' + n + ' ' : '') + d.nombre;
}

setW(getStore('bh_ticket_w') === '58' ? 58 : 80);
render();
</script>
</body>
</html>
