<style>
  :root {
    --ink: #0E1012; --ink-2: #17191C; --ink-line: #3A3D41;
    --bone: #FAF8F4; --bone-2: #EAE5DB; --line: #DDD6C9; --chip: #CFC8BB;
    --text: #121212; --muted: #5E5850; --soft: #3A362F; --on-ink-muted: #CFC8BB;
    --cheddar: #FFB000; --green: #25D366; --warn-bg: #FFD9D2; --warn-ink: #7A1200;
    --display: 'Bricolage Grotesque', system-ui, sans-serif;
    --body: 'Instrument Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); }
  body { font-family: var(--body); color: var(--text); -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
  button, input { font-family: inherit; }
  button { cursor: pointer; }
  h1, h2, h3, p { margin: 0; }
  :focus-visible { outline: 3px solid var(--cheddar); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ── Pantalla de inicio: aparece el logo, gira, se agranda y queda el menú ── */
  #splash { position: fixed; inset: 0; z-index: 100; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; transition: opacity .45s ease-in; }
  #splash.out { opacity: 0; pointer-events: none; }
  #splash .bun { width: min(70vw, 50vh, 400px); aspect-ratio: 1; border-radius: 50%; overflow: hidden; opacity: 0; will-change: transform, opacity; }
  #splash .bun img { width: 100%; height: 100%; display: block; object-fit: cover; }
  #splash.go .bun { animation: sp-logo 2.2s both; }
  @keyframes sp-logo {
    0%   { opacity: 0; transform: scale(.82) rotate(0deg);   animation-timing-function: ease-out; }
    16%  { opacity: 1; transform: scale(.86) rotate(0deg);   animation-timing-function: cubic-bezier(.65, 0, .35, 1); }
    66%  { opacity: 1; transform: scale(1) rotate(360deg);   animation-timing-function: cubic-bezier(.6, 0, .9, .5); }
    100% { opacity: 1; transform: scale(3.2) rotate(360deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    #splash .bun { opacity: 1 !important; transform: none !important; animation: none !important; }
  }

  /* ── Estructura ─────────────────────────────────────────────── */
  #app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  #stage { position: relative; flex: 1 1 auto; min-height: 150px; background: var(--ink); color: var(--bone); }
  #track { position: absolute; inset: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  #track::-webkit-scrollbar { display: none; }
  #detail { scrollbar-width: none; }
  #detail::-webkit-scrollbar { display: none; }
  .slide { position: relative; flex: 0 0 100%; height: 100%; overflow: hidden; scroll-snap-align: center; scroll-snap-stop: always; background: #0B1418; }
  .slide img { position: absolute; display: block; max-width: none; }
  .slide .bg { left: -12%; top: -12%; width: 124%; height: 124%; object-fit: cover; filter: blur(26px) brightness(.62); }
  .slide .fg.cover { left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
  .slide .fg.short { -webkit-mask-image: linear-gradient(to bottom, transparent, #000 14%, #000 86%, transparent); mask-image: linear-gradient(to bottom, transparent, #000 14%, #000 86%, transparent); }
  .slide .fg.narrow { -webkit-mask-image: linear-gradient(to right, transparent, #000 16%, #000 84%, transparent); mask-image: linear-gradient(to right, transparent, #000 16%, #000 84%, transparent); }
  .shade { position: absolute; left: 0; right: 0; top: 0; height: 150px; background: linear-gradient(to bottom, rgba(14,16,18,.88), rgba(14,16,18,0)); pointer-events: none; }

  .top { position: absolute; left: 16px; right: 16px; top: 14px; display: flex; flex-direction: column; gap: 14px; pointer-events: none; }
  #bars { display: flex; gap: 5px; }
  #bars span { flex: 1; height: 4px; border-radius: 2px; background: rgba(250,248,244,.35); }
  #bars span.on { background: var(--cheddar); }
  .brand-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand { font-family: var(--display); font-size: 22px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; }
  .status { display: flex; align-items: center; gap: 7px; min-height: 32px; padding: 4px 12px; border-radius: 16px; background: rgba(14,16,18,.72); font-size: 13px; font-weight: 600; white-space: nowrap; }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: #4ADE80; flex-shrink: 0; }
  .status.closed i { background: #F87171; }

  .arrow { position: absolute; top: 50%; margin-top: -24px; width: 48px; height: 48px; border-radius: 50%; border: 0; background: rgba(14,16,18,.7); color: var(--bone); display: flex; align-items: center; justify-content: center; }
  .arrow[hidden] { display: none; }
  #prev { left: 12px; } #next { right: 12px; }
  .tag { position: absolute; left: 16px; bottom: 44px; padding: 6px 12px; border-radius: 14px; background: var(--cheddar); color: var(--text); font-size: 14px; font-weight: 700; }
  .tag[hidden] { display: none; }

  #sheet { position: relative; flex: 0 0 auto; max-height: 64vh; max-height: 64dvh; margin-top: -28px; background: var(--bone); border-radius: 28px 28px 0 0; display: flex; flex-direction: column; }
  #detail { padding: 22px 18px 14px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; overscroll-behavior: contain; }

  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .head h1 { font-family: var(--display); font-size: clamp(32px, 10.5vw, 42px); line-height: .95; font-weight: 800; letter-spacing: -.03em; }
  .head p { margin-top: 6px; font-size: 16px; line-height: 1.35; color: var(--muted); }
  .count { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .count span { font-size: 14px; font-weight: 600; color: var(--muted); }
  .link-btn { min-height: 44px; padding: 0 2px; border: 0; background: none; color: var(--text); font-size: 15px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; padding: 4px; background: var(--bone-2); border-radius: 16px; }
  .seg button { min-height: 48px; border: 0; border-radius: 12px; background: transparent; color: var(--soft); font-size: 16px; font-weight: 600; }
  .seg button[aria-pressed="true"] { background: var(--text); color: var(--bone); font-weight: 700; }

  .group { display: flex; flex-direction: column; gap: 8px; }
  .label { font-size: 15px; font-weight: 600; color: var(--soft); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; border-radius: 22px; }
  .chips button { min-height: 44px; padding: 0 16px; border: 2px solid var(--chip); border-radius: 22px; background: transparent; color: var(--text); font-size: 15px; font-weight: 600; }
  .chips button[aria-pressed="true"] { border-color: var(--text); background: var(--cheddar); font-weight: 700; }
  .missing { outline: 3px solid #D7261E; outline-offset: 4px; }

  .field { height: 50px; width: 100%; padding: 0 14px; border: 2px solid var(--chip); border-radius: 14px; background: #fff; color: var(--text); font-size: 16px; }
  .actions { display: flex; gap: 10px; position: sticky; bottom: -14px; margin: auto -18px -14px; padding: 10px 18px 14px; background: linear-gradient(to top, var(--bone) 82%, rgba(250,248,244,0)); }
  .icon-btn { flex-shrink: 0; width: 60px; height: 60px; border: 2px solid var(--chip); border-radius: 20px; background: var(--bone); color: var(--text); display: flex; align-items: center; justify-content: center; }
  .icon-btn[aria-pressed="true"] { border-color: var(--text); background: var(--bone-2); }
  .add { flex: 1; min-height: 60px; border: 0; border-radius: 20px; background: var(--text); color: var(--bone); display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-family: var(--display); font-size: 20px; font-weight: 700; }
  .add b { color: var(--cheddar); font-weight: 700; }
  .add:active, .send:active { transform: translateY(1px); }

  .extra-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .extra-row:last-child { border-bottom: 0; }
  .extra-row strong { font-size: 17px; }
  .extra-row span { font-size: 15px; color: var(--muted); }
  .pill { min-height: 44px; padding: 0 18px; border: 0; border-radius: 22px; background: var(--text); color: var(--bone); font-size: 15px; font-weight: 700; }

  #tabs { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px 14px; border-top: 1px solid var(--line); }
  #tabs .set { display: flex; gap: 2px; }
  #tabs .tab { min-height: 44px; padding: 0 13px; border: 0; border-radius: 22px; background: transparent; color: var(--soft); font-size: 15px; font-weight: 600; }
  #tabs .tab[aria-current="true"] { background: var(--bone-2); color: var(--text); font-weight: 700; }
  #cart-pill { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px 0 8px; border: 0; border-radius: 22px; background: var(--cheddar); color: var(--text); font-size: 15px; font-weight: 700; }
  #cart-pill .n { display: flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 14px; background: var(--text); color: var(--bone); font-size: 14px; }
  #cart-pill.empty { background: var(--bone-2); padding: 0 16px; }
  #cart-pill.empty .n { display: none; }
  #cart-pill.bump { animation: bump .35s ease; }
  @keyframes bump { 50% { transform: scale(1.08); } }

  /* ── Paneles (ver todo, pedido, elegir burger) ──────────────── */
  .panel { position: fixed; inset: 0; z-index: 50; display: none; flex-direction: column; overflow-y: auto; overscroll-behavior: contain; }
  .panel.open { display: flex; }
  .panel-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px 6px; }
  .back { display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0; border: 0; background: none; color: inherit; font-size: 16px; font-weight: 600; }

  #list { background: var(--bone); color: var(--text); }
  #list h2 { font-family: var(--display); font-size: 26px; font-weight: 800; letter-spacing: -.02em; padding: 18px 16px 8px; }
  .row-item { display: flex; align-items: center; gap: 14px; width: 100%; padding: 8px 16px; border: 0; background: none; text-align: left; color: var(--text); }
  .row-item img { width: 76px; height: 76px; border-radius: 16px; object-fit: cover; flex-shrink: 0; background: var(--bone-2); }
  .row-item strong { display: block; font-size: 17px; }
  .row-item span { display: block; font-size: 14px; line-height: 1.3; color: var(--muted); }
  .row-item em { margin-left: auto; padding-left: 8px; font-style: normal; font-size: 15px; font-weight: 700; white-space: nowrap; }
  .list-foot { margin-top: auto; padding: 22px 16px 26px; display: flex; flex-direction: column; gap: 10px; font-size: 15px; color: var(--muted); }
  .list-foot a { color: var(--text); font-weight: 700; }

  #cart { background: var(--ink); color: var(--bone); }
  .cart-body { padding: 8px 16px 18px; display: flex; flex-direction: column; gap: 18px; flex: 1; width: 100%; max-width: 520px; margin: 0 auto; }
  .ticket-paper { padding: 20px 18px 16px; background: var(--bone); color: var(--text); border-radius: 6px 6px 0 0; display: flex; flex-direction: column; gap: 14px; }
  .ticket-edge { height: 10px; background-image: linear-gradient(135deg, var(--bone) 50%, rgba(250,248,244,0) 50%), linear-gradient(225deg, var(--bone) 50%, rgba(250,248,244,0) 50%); background-size: 20px 20px; background-position: 0 0, 10px 0; background-repeat: repeat-x; }
  .ticket-head { display: flex; align-items: baseline; justify-content: space-between; }
  .ticket-head h2 { font-family: var(--display); font-size: 34px; line-height: 1; font-weight: 800; letter-spacing: -.03em; }
  .ticket-head span { font-size: 14px; font-weight: 600; color: var(--muted); }
  .dash { border-top: 2px dashed #B9B1A3; }
  .line { display: flex; justify-content: space-between; gap: 12px; }
  .line .what { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .line strong { font-size: 17px; }
  .line small { font-size: 14px; line-height: 1.35; color: var(--muted); overflow-wrap: anywhere; }
  .line .price { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .line .ops { display: flex; flex-wrap: wrap; gap: 0 16px; }
  .ops button { min-height: 44px; padding: 0; border: 0; background: none; font-size: 14px; font-weight: 700; color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
  .ops button.quiet { font-weight: 600; color: var(--muted); }
  .sum { display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: var(--soft); }
  .sum div { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
  .sum .total { align-items: baseline; margin-top: 4px; color: var(--text); font-family: var(--display); font-weight: 800; font-size: 22px; }
  .sum .total b { font-size: 32px; letter-spacing: -.02em; }
  .empty { padding: 26px 0 10px; text-align: center; font-size: 17px; color: var(--muted); }
  .upsell { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 2px dashed var(--ink-line); border-radius: 16px; font-size: 15px; }
  .upsell button { min-height: 44px; padding: 0 16px; border: 0; border-radius: 22px; background: var(--cheddar); color: var(--text); font-size: 15px; font-weight: 700; white-space: nowrap; }

  .form { display: flex; flex-direction: column; gap: 14px; }
  .form .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .form label, .form .label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 600; color: var(--on-ink-muted); }
  .form .field { border-color: var(--ink-line); background: var(--ink-2); color: var(--bone); }
  .form .seg { background: var(--ink-2); }
  .form .seg button { color: var(--on-ink-muted); font-size: 15px; }
  .form .seg button[aria-pressed="true"] { background: var(--bone); color: var(--text); }
  .closed-note { padding: 10px 12px; border: 1px solid #F87171; border-radius: 12px; color: #FECACA; font-size: 14px; font-weight: 600; line-height: 1.35; }
  .closed-note[hidden], [hidden].group { display: none; }
  .send-wrap { position: sticky; bottom: 0; margin-top: auto; padding: 12px 0 0; background: linear-gradient(to top, var(--ink) 70%, rgba(14,16,18,0)); }
  .send { display: flex; align-items: center; justify-content: center; min-height: 62px; border-radius: 20px; background: var(--green); color: var(--ink); font-family: var(--display); font-size: 19px; font-weight: 800; text-decoration: none; text-align: center; }

  #modal { z-index: 60; background: rgba(14,16,18,.72); align-items: center; justify-content: flex-end; }
  .modal-card { width: 100%; max-width: 520px; padding: 22px 18px 18px; background: var(--bone); border-radius: 28px 28px 0 0; display: flex; flex-direction: column; gap: 12px; }
  .modal-card h2 { font-family: var(--display); font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
  .modal-card .opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 56px; padding: 8px 16px; border: 2px solid var(--chip); border-radius: 16px; background: #fff; color: var(--text); font-size: 16px; font-weight: 600; text-align: left; }
  .modal-card .opt small { font-size: 13px; color: var(--muted); font-weight: 500; }
  .modal-card .cancel { min-height: 48px; border: 0; background: none; font-size: 16px; font-weight: 700; color: var(--soft); }

  #toast { position: fixed; left: 50%; top: 14px; z-index: 70; transform: translate(-50%, -180%); width: max-content; max-width: 92%; padding: 12px 18px; border-radius: 16px; font-size: 15px; font-weight: 700; line-height: 1.3; text-align: center; box-shadow: 0 8px 28px rgba(0,0,0,.45); transition: transform .25s ease; pointer-events: none; }
  #toast.show { transform: translate(-50%, 0); }
  #toast.ok { background: var(--cheddar); color: var(--text); }
  #toast.warn { background: var(--warn-bg); color: var(--warn-ink); }

  /* ── Pantallas grandes: foto a la izquierda, pedido a la derecha ── */
  @media (min-width: 900px) {
    #app { flex-direction: row; }
    #stage { height: 100%; }
    #sheet { width: 470px; max-height: none; height: 100%; margin-top: 0; border-radius: 0; }
    #detail { flex: 1; padding: 34px 28px 18px; justify-content: center; }
    .actions { position: static; margin: 0; padding: 0; background: none; }
    #tabs { padding: 12px 22px 18px; }
    .head h1 { font-size: 46px; }
    .brand { font-size: 26px; }
    .top { left: 28px; right: 28px; top: 22px; }
    .panel { left: auto; width: 470px; box-shadow: -18px 0 50px rgba(0,0,0,.5); }
    #modal { left: 0; width: auto; justify-content: center; }
    .modal-card { border-radius: 28px; }
  }
  @media (max-height: 640px) and (max-width: 899px) {
    #detail { gap: 12px; padding-top: 18px; }
    .add, .icon-btn { min-height: 54px; height: 54px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #toast { transition: none; }
    #cart-pill.bump { animation: none; }
    #track { scroll-behavior: auto; }
  }
</style>
<script src="codes.js"></script>

<body>

<div id="splash" role="img" aria-label="Burger Hood">
  <div class="bun"><img id="splash-img" src="img/inicio.jpg" alt="" fetchpriority="high" decoding="async"></div>
</div>
<script>
  // La animación de entrada se muestra una vez por día (o siempre si la dirección termina en #intro)
  try { if (location.hash !== '#intro' && localStorage.getItem('bh_intro') === new Date().toDateString()) document.getElementById('splash').remove(); } catch (e) {}
</script>

<div id="app">
  <section id="stage" aria-label="Fotos del menú">
    <div id="track"></div>
    <div class="shade"></div>
    <div class="top">
      <div id="bars" role="img" aria-label=""></div>
      <div class="brand-row">
        <span class="brand">Burger Hood</span>
        <span class="status" id="status"><i aria-hidden="true"></i><span id="status-text">Jueves a domingo</span></span>
      </div>
    </div>
    <span class="tag" id="tag" hidden></span>
    <button class="arrow" id="prev" type="button" aria-label="Anterior" hidden>
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="arrow" id="next" type="button" aria-label="Siguiente">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </section>

  <section id="sheet">
    <div id="detail" aria-live="polite"></div>
    <nav id="tabs" aria-label="Secciones y pedido">
      <div class="set">
        <button class="tab" type="button" data-section="burgers">Burgers</button>
        <button class="tab" type="button" data-section="papas">Papas</button>
      </div>
      <button id="cart-pill" class="empty" type="button"><span class="n" id="cart-n">0</span><span id="cart-label">Pedido</span></button>
    </nav>
  </section>
</div>

<div class="panel" id="list" role="dialog" aria-modal="true" aria-label="Todo el menú">
  <div class="panel-top">
    <button class="back" type="button" data-close="list">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      <span>Volver</span>
    </button>
    <span class="brand" style="color:var(--text)">Burger Hood</span>
  </div>
  <div id="list-body"></div>
  <div class="list-foot">
    <span>Atendemos de jueves a domingo, pedidos hasta las 23:00.</span>
    <span>¿Tenés alguna duda? <a href="https://wa.me/542236878311" target="_blank" rel="noopener">Escribinos por WhatsApp</a></span>
  </div>
</div>

<div class="panel" id="cart" role="dialog" aria-modal="true" aria-label="Tu pedido">
  <div class="panel-top">
    <button class="back" type="button" data-close="cart">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      <span>Seguir eligiendo</span>
    </button>
    <span class="brand" style="font-size:20px">Burger Hood</span>
  </div>
  <div class="cart-body">
    <div>
      <div class="ticket-paper" id="ticket-paper"></div>
      <div class="ticket-edge" aria-hidden="true"></div>
    </div>
    <div id="upsell"></div>
    <div class="form" id="form">
      <div class="two">
        <div><label for="customer-name">Tu nombre</label><input class="field" id="customer-name" type="text" maxlength="40" autocomplete="given-name"></div>
        <div><label for="customer-phone">Tu teléfono</label><input class="field" id="customer-phone" type="tel" inputmode="tel" maxlength="20" autocomplete="tel"></div>
      </div>
      <div id="entrega-group">
        <span class="label">¿Cómo lo recibís?</span>
        <div class="seg" id="entrega-seg">
          <button type="button" data-entrega="retiro" aria-pressed="false">Paso a buscar</button>
          <button type="button" data-entrega="delivery" aria-pressed="false" id="btn-delivery">Delivery</button>
        </div>
      </div>
      <div id="address-wrap" hidden>
        <label for="delivery-address">¿A qué dirección?</label>
        <input class="field" id="delivery-address" type="text" maxlength="90" autocomplete="street-address" placeholder="Calle, número, piso">
      </div>
      <div id="pago-group">
        <span class="label">¿Cómo pagás?</span>
        <div class="seg" id="pago-seg">
          <button type="button" data-pago="transferencia" aria-pressed="false">Transferencia</button>
          <button type="button" data-pago="efectivo" aria-pressed="false">Efectivo</button>
        </div>
      </div>
      <div class="closed-note" id="closed-note" hidden></div>
    </div>
    <div class="send-wrap">
      <a class="send" id="send" href="https://wa.me/542236878311" target="_blank" rel="noopener">Enviar pedido por WhatsApp</a>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
// ═════════════════════════════════════════════════════════════════════════════
//  MENÚ — para cambiar precios, nombres o sumar productos, se toca solo acá.
//  (Si agregan un producto nuevo, sumen también su nombre al final de codes.js)
// ═════════════════════════════════════════════════════════════════════════════
const WHATSAPP = '542236878311';
const DELIVERY_FEE = 3000;
const SALSAS = ['Cheddar', 'Mil Islas', 'Barbacoa', 'Alioli', 'Sin salsa'];
// dias: 0 = domingo ... 6 = sábado.  abre: hora de apertura tipo '20:00' (null = no se muestra).
const HORARIO = { dias: [4, 5, 6, 0], abre: null, cierra: '23:00' };

const MENU = {
  burgers: [
    { name: 'Cheese Burger',  desc: 'Carne, cheddar x2, salsa 1/4 libra.', img: 'img/foto-01.jpg', focus: { w: 1066, h: 1600, cx: .48, cy: .52, fw: .96, fh: .50 }, prices: { Simple: 14000, Doble: 16000 } },
    { name: 'Cheese Bacon',   desc: 'Carne, cheddar x2, bacon, salsa mil islas.', img: 'img/foto-02.jpg', focus: { w: 728, h: 1093, cx: .48, cy: .57, fw: .92, fh: .46 }, prices: { Simple: 14000, Doble: 16000 } },
    { name: 'Española',       desc: 'Carne, cheddar x2, tortilla de papa, salsa alioli, morrón dulce.', img: 'img/foto-03.jpg', focus: { w: 714, h: 1068, cx: .50, cy: .60, fw: .78, fh: .48 }, prices: { Simple: 14000, Doble: 16000 } },
    { name: 'Burger Hood',    desc: 'Carne, cheddar x2, pan relleno con cheddar, salsa a elección.', img: 'img/foto-04.jpg', focus: { w: 733, h: 1096, cx: .55, cy: .55, fw: .95, fh: .52 }, prices: { Doble: 17800, Triple: 20800 }, salsaBurger: true, tag: 'La casa' },
    { name: 'Mega Hood',      desc: 'Carne 120 g, cheddar x2, panceta, cebolla caramelizada, provoleta, salsa a elección.', img: 'img/foto-05.jpg', focus: { w: 663, h: 995, cx: .52, cy: .55, fw: .95, fh: .70 }, prices: { Doble: 17800, Triple: 20800 }, salsaBurger: true },
    { name: 'Veggie Burger',  desc: 'Medallón veggie (NotBurger), cheddar x2, cebolla caramelizada, huevo, salsa alioli.', img: 'img/foto-06.jpg', focus: { w: 747, h: 1121, cx: .50, cy: .50, fw: .98, fh: .62 }, prices: { Simple: 14000, Doble: 16000 }, tag: 'Veggie' },
    { name: 'Oklahoma',       desc: 'Carne, cheddar x2, bacon, huevo, cebolla caramelizada, salsa barbacoa.', img: 'img/foto-07.jpg', focus: { w: 719, h: 1079, cx: .45, cy: .56, fw: .92, fh: .46 }, prices: { Simple: 14000, Doble: 16000 } }
  ],
  papas: [
    { name: 'Papas Fritas', desc: '', img: 'img/foto-08.jpg', focus: { cover: true }, price: 7500 },
    { name: 'Papas Fritas Cheddar', desc: '', img: 'img/foto-09.jpg', focus: { cover: true }, price: 8500 },
    { name: 'Papas Fritas Cheddar y Bacon', desc: '', img: 'img/foto-10.jpg', focus: { w: 800, h: 533, cx: .5, cy: .5, fw: .72, fh: .92 }, price: 9500 },
    { name: 'Papas Hood', desc: 'Papas, cheddar, bacon y 2 huevos fritos.', img: 'img/foto-11.jpg', focus: { w: 880, h: 585, cx: .5, cy: .52, fw: .72, fh: .92 }, price: 10500 },
    { name: 'Nuggets', cartName: 'Nuggets x10 + Papas', desc: '10 unidades + papas.', img: 'img/foto-12.jpg', focus: { w: 676, h: 1014, cx: .52, cy: .52, fw: .95, fh: .64 }, price: 14000 }
  ],
  extras: [
    { name: 'Carne + Cheddar x2', price: 4000 },
    { name: 'Provoleta', price: 2500 },
    { name: 'Bacon', price: 1000 },
    { name: 'Huevo', price: 1000 },
    { name: 'Cebolla caramelizada', price: 1000 }
  ]
};
const SIZE_DEFAULT = 'Doble';

// ── Estado ───────────────────────────────────────────────────────────────────
let cart = [];
let pagoSeleccionado = null;      // 'transferencia' | 'efectivo'
let entregaSeleccionada = null;   // 'retiro' | 'delivery'
let section = 'burgers';
let index = 0;
const picks = {};                 // lo que eligió en cada burger: { size, dip, bs, nota, notaOpen }

const $ = id => document.getElementById(id);
const fmt = n => '$' + Number(n).toLocaleString('es-AR');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} return null; };
const pick = name => picks[name] || (picks[name] = { size: null, dip: '', bs: '', extras: [], nota: '', notaOpen: false });

// ── Avisos ───────────────────────────────────────────────────────────────────
function notify(msg, kind, el) {
  kind = kind || 'warn';
  const t = $('toast');
  t.textContent = msg; t.className = kind; void t.offsetWidth; t.className = kind + ' show';
  clearTimeout(notify.t);
  notify.t = setTimeout(() => { t.className = kind; }, kind === 'ok' ? 1900 : 3600);
  if (el) {
    el.classList.add('missing');
    setTimeout(() => el.classList.remove('missing'), 3000);
    try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {}
    if (el.tagName === 'INPUT') { try { el.focus({ preventScroll: true }); } catch (e) {} }
  }
}

// ── Carrusel de fotos ────────────────────────────────────────────────────────
function items() { return MENU[section]; }

function buildStage() {
  const list = items();
  const track = $('track');
  track.innerHTML = list.map((it, i) => {
    const load = i === 0 ? 'fetchpriority="high"' : 'loading="lazy"';
    const bg = it.focus.cover ? '' : `<img class="bg" src="${esc(it.img)}" alt="" aria-hidden="true" ${load} decoding="async">`;
    return `<div class="slide">${bg}<img class="fg${it.focus.cover ? ' cover' : ''}" src="${esc(it.img)}" alt="${esc(it.name)}" ${load} decoding="async"></div>`;
  }).join('');
  layoutStage();
  $('bars').innerHTML = list.map(() => '<span></span>').join('');
  track.scrollLeft = 0;
  syncStage();
}

// Acomoda cada foto para que el producto se vea entero y centrado, sea cual sea el tamaño de pantalla
function layoutStage() {
  const st = $('stage'), W = st.clientWidth, H = st.clientHeight;
  if (!W || !H) return;
  const wide = window.matchMedia('(min-width: 900px)').matches;
  const top = wide ? 70 : 30, bottom = wide ? 24 : 34;      // lugar que tapan el logo y la hoja
  const availH = Math.max(60, H - top - bottom);
  const list = items();
  document.querySelectorAll('#track .slide').forEach((sl, i) => {
    const f = list[i] && list[i].focus, img = sl.querySelector('.fg');
    if (!f || f.cover || !img) return;
    const s = Math.min(availH / (f.fh * f.h), 0.96 * W / (f.fw * f.w));
    const iw = f.w * s, ih = f.h * s;
    let left = W / 2 - f.cx * iw, y = top + availH / 2 - f.cy * ih;
    if (iw >= W) left = Math.min(0, Math.max(W - iw, left));
    if (ih >= H) y = Math.min(0, Math.max(H - ih, y));
    img.style.width = iw + 'px'; img.style.height = ih + 'px';
    img.style.left = left + 'px'; img.style.top = y + 'px';
    img.classList.toggle('narrow', iw < W - 2);
    img.classList.toggle('short', iw >= W - 2 && ih < H - 2);
  });
}
if (window.ResizeObserver) new ResizeObserver(() => { layoutStage(); $('track').scrollLeft = index * $('track').clientWidth; }).observe($('stage'));

function syncStage() {
  const list = items();
  Array.from($('bars').children).forEach((b, i) => b.classList.toggle('on', i <= index));
  $('bars').setAttribute('aria-label', list.length ? `${index + 1} de ${list.length}` : '');
  $('prev').hidden = !list.length || index === 0;
  $('next').hidden = !list.length || index === list.length - 1;
  const tag = list[index] && list[index].tag;
  $('tag').hidden = !tag; $('tag').textContent = tag || '';
}

function goTo(i, smooth) {
  const list = items();
  if (!list.length) return;
  index = Math.max(0, Math.min(list.length - 1, i));
  const track = $('track');
  const left = index * track.clientWidth;
  if (smooth && track.scrollTo) track.scrollTo({ left, behavior: 'smooth' }); else track.scrollLeft = left;
  syncStage(); renderDetail();
}

let scrollTick = false;
$('track').addEventListener('scroll', () => {
  if (scrollTick) return; scrollTick = true;
  requestAnimationFrame(() => {
    scrollTick = false;
    const track = $('track'), list = items();
    if (!list.length || !track.clientWidth) return;
    const i = Math.round(track.scrollLeft / track.clientWidth);
    if (i !== index && i >= 0 && i < list.length) { index = i; syncStage(); renderDetail(); }
  });
});
$('prev').addEventListener('click', () => goTo(index - 1, true));
$('next').addEventListener('click', () => goTo(index + 1, true));
window.addEventListener('resize', () => { layoutStage(); $('track').scrollLeft = index * $('track').clientWidth; });

// Deslizar también sobre la hoja de abajo
(function () {
  let x0 = null, y0 = null;
  const d = $('detail');
  d.addEventListener('touchstart', e => { if (e.target.closest('input')) { x0 = null; return; } x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  d.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6) goTo(index + (dx < 0 ? 1 : -1), true);
  }, { passive: true });
})();

function setSection(s, i) {
  section = s; index = i || 0;
  document.querySelectorAll('#tabs .tab').forEach(t => t.setAttribute('aria-current', String(t.dataset.section === s)));
  buildStage();
  if (index) $('track').scrollLeft = index * $('track').clientWidth;
  syncStage(); renderDetail();
  $('detail').scrollTop = 0;
}

// ── Hoja con el producto ─────────────────────────────────────────────────────
const ICON_NOTE = '<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10-4-4L4 16v4z"/><path d="M13 7l4 4"/></svg>';

function chips(group, value) {
  return `<div class="chips" data-group="${group}">` + SALSAS.map(s =>
    `<button type="button" data-salsa="${esc(s)}" aria-pressed="${s === value}">${esc(s)}</button>`).join('') + '</div>';
}

function renderDetail() {
  const d = $('detail');
  const list = items(), it = list[index];
  const head = `
    <div class="head">
      <div><h1>${esc(it.name)}</h1>${it.desc ? `<p>${esc(it.desc)}</p>` : ''}</div>
      <div class="count"><span>${index + 1} de ${list.length}</span><button class="link-btn" type="button" data-open="list">Ver todo</button></div>
    </div>`;
  if (section === 'papas') {
    d.innerHTML = head + `<div class="actions"><button class="add" type="button" data-add="simple"><span>Agregar</span><b>${fmt(it.price)}</b></button></div>`;
    return;
  }
  const p = pick(it.name);
  if (!p.size || !(p.size in it.prices)) p.size = (SIZE_DEFAULT in it.prices) ? SIZE_DEFAULT : Object.keys(it.prices)[0];
  d.innerHTML = head + `
    <div class="seg" data-group="size">` + Object.keys(it.prices).map(s =>
      `<button type="button" data-size="${esc(s)}" aria-pressed="${s === p.size}">${esc(s)} ${fmt(it.prices[s])}</button>`).join('') + `</div>
    <div class="group"><span class="label">Salsa para dipear</span>${chips('dip', p.dip)}</div>
    ${it.salsaBurger ? `<div class="group"><span class="label">Salsa de la burger</span>${chips('bs', p.bs)}</div>` : ''}
    <div class="group"><span class="label">¿Le sumás algo?</span><div class="chips" data-group="extras">` + MENU.extras.map(x =>
      `<button type="button" data-extra="${esc(x.name)}" aria-pressed="${p.extras.indexOf(x.name) >= 0}">${esc(x.name)} +${fmt(x.price)}</button>`).join('') + `</div></div>
    <div class="group" id="nota-wrap" ${p.notaOpen ? '' : 'hidden'}>
      <label class="label" for="nota">¿Algo para aclarar?</label>
      <input class="field" id="nota" type="text" maxlength="80" placeholder="Sin cebolla, bien cocida" value="${esc(p.nota)}">
    </div>
    <div class="actions">
      <button class="icon-btn" type="button" data-nota aria-label="Agregar una aclaración" aria-pressed="${p.notaOpen || !!p.nota}">${ICON_NOTE}</button>
      <button class="add" type="button" data-add="burger"><span>Agregar</span><b>${fmt(it.prices[p.size] + extrasOf(p).reduce((a, x) => a + x.price, 0))}</b></button>
    </div>`;
}

const extrasOf = p => MENU.extras.filter(x => p.extras.indexOf(x.name) >= 0).map(x => ({ name: x.name, price: x.price }));

$('detail').addEventListener('input', e => {
  if (e.target.id === 'nota') pick(items()[index].name).nota = e.target.value;
});

$('detail').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.open === 'list') return openPanel('list');
  const it = items()[index];
  if (b.dataset.add === 'simple') {
    cart.push({ name: it.cartName || it.name, size: '', detail: '', price: it.price });
    return added(it.name);
  }
  const p = pick(it.name);
  if (b.dataset.size) { p.size = b.dataset.size; return keepScroll(renderDetail); }
  if (b.dataset.extra) {
    const k = p.extras.indexOf(b.dataset.extra);
    if (k >= 0) p.extras.splice(k, 1); else p.extras.push(b.dataset.extra);
    return keepScroll(renderDetail);
  }
  if (b.dataset.salsa) {
    const g = b.parentNode.dataset.group; p[g] = b.dataset.salsa;
    b.parentNode.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    return;
  }
  if (b.hasAttribute('data-nota')) {
    p.notaOpen = !p.notaOpen; keepScroll(renderDetail);
    if (p.notaOpen) { const n = $('nota'); n.focus(); n.scrollIntoView({ block: 'center' }); }
    return;
  }
  if (b.dataset.add === 'burger') {
    if (!p.dip) return notify('Elegí una salsa para dipear (o "Sin salsa").', 'warn', $('detail').querySelector('[data-group="dip"]'));
    if (it.salsaBurger && !p.bs) return notify('Elegí la salsa de la burger.', 'warn', $('detail').querySelector('[data-group="bs"]'));
    let detail = `Tamaño: ${p.size} | Dip: ${p.dip}`;
    if (it.salsaBurger) detail += ` | Salsa burger: ${p.bs}`;
    const item = { name: it.name, size: p.size, detail, price: it.prices[p.size], nota: p.nota.trim() };
    const ex = extrasOf(p);
    if (ex.length) item.extras = ex;
    cart.push(item);
    p.nota = ''; p.notaOpen = false; p.extras = [];
    renderDetail(); $('detail').scrollTop = 0;
    added(it.name);
  }
});

function keepScroll(fn) { const d = $('detail'), y = d.scrollTop; fn(); d.scrollTop = y; }

function added(name) {
  renderCart();
  notify('Agregado: ' + name, 'ok');
  const pill = $('cart-pill'); pill.classList.remove('bump'); void pill.offsetWidth; pill.classList.add('bump');
}

// ── Paneles ──────────────────────────────────────────────────────────────────
function openPanel(id) {
  if (id === 'list') renderList();
  if (id === 'cart') renderCart();
  $(id).classList.add('open'); $(id).scrollTop = 0;
  const f = $(id).querySelector('button, a'); if (f) { try { f.focus({ preventScroll: true }); } catch (e) {} }
}
function closePanel(id) { $(id).classList.remove('open'); }
document.addEventListener('click', e => {
  const c = e.target.closest('[data-close]'); if (c) closePanel(c.dataset.close);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  ['cart', 'list'].some(id => $(id).classList.contains('open') && (closePanel(id), true));
});
$('cart-pill').addEventListener('click', () => openPanel('cart'));
$('tabs').addEventListener('click', e => { const t = e.target.closest('.tab'); if (t) setSection(t.dataset.section); });

function renderList() {
  const block = (title, key) => `<h2>${title}</h2>` + MENU[key].map((it, i) => `
    <button class="row-item" type="button" data-go="${key}:${i}">
      <img src="${esc(it.img)}" alt="" loading="lazy">
      <span style="display:block;min-width:0"><strong>${esc(it.name)}</strong>${it.desc ? `<span>${esc(it.desc)}</span>` : ''}</span>
      <em>${it.prices ? 'Desde ' + fmt(Math.min.apply(null, Object.values(it.prices))) : fmt(it.price)}</em>
    </button>`).join('');
  $('list-body').innerHTML = block('Hamburguesas', 'burgers') + block('Papas y nuggets', 'papas');
}
$('list-body').addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if (!b) return;
  const [s, i] = b.dataset.go.split(':');
  closePanel('list'); setSection(s, +i);
});

// ── Pedido (ticket) ──────────────────────────────────────────────────────────
function totals() {
  const subtotal = cart.reduce((s, i) => s + i.price + (i.extras ? i.extras.reduce((a, e) => a + e.price, 0) : 0), 0);
  const fee = entregaSeleccionada === 'delivery' ? DELIVERY_FEE : 0;
  return { subtotal, fee, total: subtotal + fee };
}

function renderCart() {
  const { subtotal, fee, total } = totals();
  const pill = $('cart-pill');
  pill.classList.toggle('empty', !cart.length);
  $('cart-n').textContent = cart.length;
  $('cart-label').textContent = cart.length ? fmt(subtotal) : 'Pedido';
  pill.setAttribute('aria-label', cart.length ? `Ver pedido, ${cart.length} productos, ${fmt(subtotal)}` : 'Ver pedido, vacío');

  const paper = $('ticket-paper');
  if (!cart.length) {
    paper.innerHTML = `<div class="ticket-head"><h2>Tu pedido</h2></div><div class="dash"></div><p class="empty">Todavía no agregaste nada.<br>Elegí algo del menú.</p>`;
  } else {
    paper.innerHTML = `<div class="ticket-head"><h2>Tu pedido</h2><span>${cart.length} ${cart.length === 1 ? 'producto' : 'productos'}</span></div><div class="dash"></div>` +
      cart.map((it, i) => {
        const ex = it.extras || [];
        const line = it.price + ex.reduce((a, e) => a + e.price, 0);
        return `<div class="line"><div class="what">
            <strong>${esc(it.name)}${it.size ? ' ' + esc(it.size.toLowerCase()) : ''}</strong>
            ${it.detail ? `<small>${esc(it.detail.split(' | ').slice(1).join(', '))}</small>` : ''}
            ${it.nota ? `<small>Nota: ${esc(it.nota)}</small>` : ''}
            ${ex.map((e, ei) => `<small>+ ${esc(e.name)} (${fmt(e.price)}) <button type="button" class="link-btn" style="min-height:32px;font-size:13px;color:var(--muted)" data-rmx="${i}:${ei}">quitar</button></small>`).join('')}
            <div class="ops"><button type="button" data-dup="${i}">Sumar otra igual</button><button type="button" class="quiet" data-rm="${i}">Quitar</button></div>
          </div><span class="price">${fmt(line)}</span></div>`;
      }).join('') +
      `<div class="dash"></div><div class="sum">
        ${fee ? `<div><span>Subtotal</span><span>${fmt(subtotal)}</span></div><div><span>Delivery</span><span>${fmt(fee)}</span></div>` : ''}
        <div class="total"><span>Total</span><b>${fmt(total)}</b></div></div>`;
  }

  const hood = MENU.papas.find(p => p.name === 'Papas Hood');
  const showUp = hood && cart.some(i => i.detail) && !cart.some(i => i.name === 'Papas Hood');
  $('upsell').innerHTML = showUp ? `<div class="upsell"><span>¿Le sumás unas Papas Hood? Cheddar, bacon y 2 huevos fritos.</span><button type="button" id="up-add">Sumar ${fmt(hood.price)}</button></div>` : '';
  $('form').style.display = cart.length ? '' : 'none';
  $('send').parentNode.style.display = cart.length ? '' : 'none';

  store('bh_cart', JSON.stringify({ ts: Date.now(), items: cart }));
}

$('cart').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.dup !== undefined) { const i = +b.dataset.dup; cart.splice(i + 1, 0, JSON.parse(JSON.stringify(cart[i]))); return renderCart(); }
  if (b.dataset.rm !== undefined) { cart.splice(+b.dataset.rm, 1); return renderCart(); }
  if (b.dataset.rmx !== undefined) { const [i, ei] = b.dataset.rmx.split(':'); cart[+i].extras.splice(+ei, 1); return renderCart(); }
  if (b.id === 'up-add') { const h = MENU.papas.find(p => p.name === 'Papas Hood'); cart.push({ name: h.name, size: '', detail: '', price: h.price }); renderCart(); return notify('Agregado: Papas Hood', 'ok'); }
  if (b.dataset.entrega) return selectEntrega(b.dataset.entrega);
  if (b.dataset.pago) return selectPago(b.dataset.pago);
});

function selectPago(tipo) {
  pagoSeleccionado = tipo;
  document.querySelectorAll('#pago-seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.pago === tipo)));
}
function selectEntrega(tipo) {
  entregaSeleccionada = tipo;
  document.querySelectorAll('#entrega-seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.entrega === tipo)));
  $('address-wrap').hidden = tipo !== 'delivery';
  renderCart();
}

// ── Enviar por WhatsApp ──────────────────────────────────────────────────────
$('send').addEventListener('click', function (e) {
  const stop = (msg, el) => { e.preventDefault(); notify(msg, 'warn', el); };
  if (!cart.length) return stop('Agregá algo al pedido primero.');
  const nombre = $('customer-name').value.trim();
  if (!nombre) return stop('Falta tu nombre.', $('customer-name'));
  const telefono = $('customer-phone').value.replace(/\D/g, '');
  if (telefono.length < 8) return stop('Falta tu número de teléfono.', $('customer-phone'));
  if (!entregaSeleccionada) return stop('Elegí si lo pasás a buscar o querés delivery.', $('entrega-seg'));
  const addr = entregaSeleccionada === 'delivery' ? $('delivery-address').value.trim() : null;
  if (entregaSeleccionada === 'delivery' && !addr) return stop('Falta la dirección para el delivery.', $('delivery-address'));
  if (!pagoSeleccionado) return stop('Elegí cómo vas a pagar.', $('pago-seg'));

  const { subtotal, fee, total } = totals();
  let msg = '🍔 *BURGER HOOD — Pedido nuevo*\n';
  msg += `👤 Nombre: *${nombre}*\n📞 Tel: ${telefono}\n\n`;
  cart.forEach((item, i) => {
    msg += `${i + 1}. *${item.name}*`;
    if (item.detail) msg += `\n   ${item.detail}`;
    if (item.nota)   msg += `\n   📝 Nota: ${item.nota}`;
    if (item.extras && item.extras.length > 0) item.extras.forEach(x => { msg += `\n   ➕ Extra: ${x.name} (+${fmt(x.price)})`; });
    msg += `\n   ${fmt(item.price + (item.extras ? item.extras.reduce((s, x) => s + x.price, 0) : 0))}\n\n`;
  });
  msg += `━━━━━━━━━━━━━━\n`;
  if (fee > 0) msg += `📦 Subtotal: ${fmt(subtotal)}\n🛵 Delivery: ${fmt(fee)}\n`;
  msg += `💰 *TOTAL: ${fmt(total)}*\n\n`;
  msg += `💳 Abona con: *${pagoSeleccionado.charAt(0).toUpperCase() + pagoSeleccionado.slice(1)}*\n`;
  msg += entregaSeleccionada === 'delivery' ? `🛵 *Delivery* — Dirección: ${addr}` : `🏠 *Pasa a buscar por el local*`;
  try { msg += `\n\n🧾 Ticket: ${buildTicketUrl(nombre, addr, telefono)}`; } catch (err) { /* si falla, el pedido sale igual sin link */ }

  this.href = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`;   // el link se abre solo, en WhatsApp
  store('bh_cart', JSON.stringify({ sent: true, ts: Date.now(), items: [] }));
});

// ── Link al ticket (formato corto, lo lee t.html con la tabla de codes.js) ───
function buildTicketUrl(nombre, addr, telefono) {
  const T = window.BH_CODES || [];
  const A = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const e = s => String(s).replace(/[\\|~",]/g, '\\$&');
  const tok = s => { const i = T.indexOf(s); return (i >= 0 && i < A.length) ? A[i] : '"' + e(s) + '"'; };
  const num = n => (n % 100 === 0) ? (n / 100).toString(36) : '=' + n.toString(36);

  const flag = 'abcd'[(pagoSeleccionado === 'transferencia' ? 0 : 2) + (entregaSeleccionada === 'delivery' ? 1 : 0)];
  const mins = Math.floor((Date.now() - Date.UTC(2026, 0, 1)) / 60000);
  const fee  = entregaSeleccionada === 'delivery' ? DELIVERY_FEE : 0;
  const parts = ['2' + flag + '|' + mins.toString(36) + '|' + (fee ? num(fee) : '') + '|' + e(nombre) + '|' + e(addr || '') + '|' + (telefono || '')];

  cart.forEach(it => {
    const f = [
      tok(it.name),
      num(it.price),
      (it.detail || '').split(' | ').filter(Boolean).map(tok).join(''),
      (it.extras || []).map(x => tok(x.name) + num(x.price) + ',').join(''),
      e(it.nota || '')
    ];
    while (f.length > 2 && f[f.length - 1] === '') f.pop();
    parts.push(f.join('|'));
  });

  const bytes = new TextEncoder().encode(parts.join('~'));
  let bin = '';
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  const b64 = btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  return new URL('t.html', window.location.href.split('#')[0].split('?')[0]).href + '#' + b64;
}

// ── Horario ──────────────────────────────────────────────────────────────────
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
function estadoLocal() {
  const ar = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Argentina/Buenos_Aires' }));
  const mins = ar.getHours() * 60 + ar.getMinutes();
  const toMin = h => { const p = h.split(':'); return (+p[0]) * 60 + (+p[1]); };
  const hoyAbre = HORARIO.dias.indexOf(ar.getDay()) >= 0;
  let prox = ar.getDay();
  for (let i = 1; i <= 7; i++) { prox = (ar.getDay() + i) % 7; if (HORARIO.dias.indexOf(prox) >= 0) break; }
  const manana = prox === (ar.getDay() + 1) % 7;
  const vuelve = manana ? 'volvemos mañana' : 'volvemos el ' + DIAS[prox];
  if (hoyAbre && mins < toMin(HORARIO.cierra)) {
    if (HORARIO.abre && mins < toMin(HORARIO.abre)) return { ok: true, corto: 'Hoy abrimos a las ' + HORARIO.abre };
    if (HORARIO.abre) return { ok: true, corto: 'Abierto hasta las ' + HORARIO.cierra };
    return { ok: true, corto: 'Hoy hasta las ' + HORARIO.cierra };
  }
  return { ok: false, corto: 'Cerrado, abre ' + (manana ? 'mañana' : 'el ' + DIAS[prox]), largo: (hoyAbre ? 'Por hoy ya cerramos, ' : 'Hoy estamos cerrados, ') + vuelve + '. Atendemos de jueves a domingo hasta las ' + HORARIO.cierra + '.' };
}
function pintarEstado() {
  const e = estadoLocal();
  $('status-text').textContent = e.corto;
  $('status').classList.toggle('closed', !e.ok);
  $('closed-note').hidden = e.ok;
  $('closed-note').textContent = e.largo || '';
}

// ── Lo que se recuerda en el celular del cliente ─────────────────────────────
function guardarCliente() {
  store('bh_cliente', JSON.stringify({ n: $('customer-name').value.trim(), t: $('customer-phone').value.trim(), a: $('delivery-address').value.trim() }));
}
function restaurar() {
  try {
    const c = JSON.parse(store('bh_cliente') || 'null');
    if (c) { if (c.n) $('customer-name').value = c.n; if (c.t) $('customer-phone').value = c.t; if (c.a) $('delivery-address').value = c.a; }
  } catch (e) {}
  try {
    // El pedido a medio armar se conserva 6 horas; si ya se envió, se arranca de cero
    const k = JSON.parse(store('bh_cart') || 'null');
    if (k && !k.sent && Array.isArray(k.items) && Date.now() - k.ts < 6 * 3600 * 1000) {
      cart = k.items.filter(it => it && typeof it.name === 'string' && typeof it.price === 'number');
    }
  } catch (e) {}
  ['customer-name', 'customer-phone', 'delivery-address'].forEach(id => $(id).addEventListener('input', guardarCliente));
}

// ── Pantalla de inicio: aparece el logo, gira, se agranda y queda el menú ────
(function () {
  const sp = $('splash');
  if (!sp) return;                              // hoy ya se mostró
  const img = $('splash-img');
  let started = false, gone = false;
  const leave = () => {
    if (gone) return; gone = true;
    sp.classList.add('out');
    setTimeout(() => sp.remove(), 480);
  };
  const start = () => {
    if (started) return; started = true;
    store('bh_intro', new Date().toDateString());
    sp.classList.add('go');
    setTimeout(leave, 1780);
  };
  // Arranca cuando la foto está lista; si tarda más de un segundo y medio, se saltea para no demorar el pedido
  if (img.complete && img.naturalWidth) start(); else { img.addEventListener('load', start); img.addEventListener('error', leave); }
  setTimeout(() => { if (!started) leave(); }, 1500);
  sp.addEventListener('click', leave);          // un toque la saltea
})();

// ── Arranque ─────────────────────────────────────────────────────────────────
$('btn-delivery').textContent = 'Delivery +' + fmt(DELIVERY_FEE);
restaurar();
setSection('burgers');
renderCart();
pintarEstado();
setInterval(pintarEstado, 60000);
</script>
